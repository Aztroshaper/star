<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Graphic Design</title>

    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23FFB300'><path d='M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z'/></svg>">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        @font-face {
            font-family: 'Aztro';
            src: url('aztro.otf') format('opentype');
            font-weight: normal;
            font-style: normal;
        }

        :root {
            --black: #000000;
            --yellow: #FFB300;
            --white: #f5f5f5;
            --charcoal: #111111;
            --text-gray: #999999;
            --menu-bar-h: 78px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        body {
            background-color: var(--black);
            background-image: radial-gradient(circle at 50% 0%, #151107 0%, #030303 70%);
            color: var(--white);
            font-family: 'Aztro', 'Segoe UI', Tahoma, sans-serif;
            overflow: hidden; 
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding-top: 50px;
            padding-bottom: var(--menu-bar-h);
        }

        img {
            -webkit-user-drag: none;
            -khtml-user-drag: none;
            -moz-user-drag: none;
            -o-user-drag: none;
            user-drag: none;
            display: block;
            width: 100%;
            object-fit: cover;
        }

        .picos-blancos-top {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 16px;
            background-color: var(--white);
            clip-path: polygon(0% 0%, 100% 0%, 100% 100%, 95% 15%, 90% 100%, 85% 15%, 80% 100%, 75% 15%, 70% 100%, 65% 15%, 60% 100%, 55% 15%, 50% 100%, 45% 15%, 40% 100%, 35% 15%, 30% 100%, 25% 15%, 20% 100%, 15% 15%, 10% 100%, 5% 15%, 0% 100%);
            z-index: 500;
            pointer-events: none;
        }

        .top-bar {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(3, 3, 3, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 20px 5%;
            z-index: 100;
            border-bottom: 1px solid rgba(255, 179, 0, 0.15);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .btn-back {
            color: var(--yellow);
            text-decoration: none;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: color 0.4s, text-shadow 0.4s;
        }

        .btn-back i { font-size: 0.75rem; }

        .btn-back:hover {
            color: var(--white);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
        }

        .brand-mark {
            color: var(--white);
            font-size: 0.75rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            opacity: 0.4;
        }

        .project-header {
            text-align: center;
            margin-bottom: 30px;
            pointer-events: none;
            z-index: 10;
        }

        .project-title {
            color: var(--white);
            font-size: 4.5rem;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 15px;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(255, 179, 0, 0.15);
        }

        .project-subtitle {
            color: var(--yellow);
            font-size: 0.9rem;
            letter-spacing: 6px;
            text-transform: uppercase;
        }

        .treadmill-viewport {
            width: 100vw;
            height: 55vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        /* Ya no tiene animación CSS, se maneja por JS */
        .treadmill-track-container {
            display: flex;
            width: max-content;
            cursor: grab;
            will-change: transform;
        }

        .treadmill-track-container:active {
            cursor: grabbing;
        }

        .treadmill-set {
            display: flex;
            flex-shrink: 0;
        }

        .treadmill-item {
            height: 55vh;
            margin-right: 40px;
            flex-shrink: 0;
            border: 2px solid #000;
            background: #000;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.4s, box-shadow 0.4s;
            position: relative;
        }

        .treadmill-item:hover {
            transform: scale(1.02);
            border-color: var(--yellow);
            box-shadow: 0 15px 30px rgba(255, 179, 0, 0.3);
            z-index: 20;
        }

        .treadmill-item img {
            height: 100%;
            width: auto;
            object-fit: contain;
            display: block;
            pointer-events: auto;
        }

        .treadmill-item video {
            height: 100%;
            width: auto;
            object-fit: contain;
            display: block;
            pointer-events: none;
        }

        .litecase-badge {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            color: var(--yellow);
            padding: 8px 12px;
            font-size: 0.8rem;
            border: 1px solid var(--yellow);
            border-radius: 4px;
            letter-spacing: 2px;
            pointer-events: none;
        }

        #lightbox {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(3, 3, 3, 0.98);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            z-index: 1000;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        #lightbox.active {
            display: flex;
            opacity: 1;
        }

        .close-btn {
            position: absolute;
            top: 30px;
            right: 40px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #000;
            border: 3px solid var(--yellow);
            color: var(--yellow);
            font-size: 32px;
            font-weight: normal;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000; /* Incrementado para evitar bloqueos */
            box-shadow: 0 0 15px rgba(255, 179, 0, 0.5);
            transition: all 0.3s ease;
            pointer-events: auto;
        }

        .close-btn:hover {
            background: var(--yellow);
            color: #000;
            transform: scale(1.15) rotate(90deg);
            box-shadow: 0 0 30px rgba(255, 179, 0, 0.8);
        }

        .lightbox-main-view {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 60px 30px 30px 30px;
            overflow: hidden;
            cursor: pointer; /* Para cerrar clickeando afuera */
        }

        .lightbox-main-view img {
            max-width: 95vw;
            max-height: 75vh;
            object-fit: contain;
            box-shadow: 0 15px 50px rgba(0,0,0,0.9);
            animation: zoomIn 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: default; /* No cierra si haces clic en la imagen */
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .lightbox-thumbnails {
            height: 130px;
            background: rgba(0,0,0,0.5);
            display: flex;
            gap: 15px;
            padding: 20px;
            overflow-x: auto;
            justify-content: flex-start;
            border-top: 1px solid rgba(255, 179, 0, 0.2);
            align-items: center;
            z-index: 1005;
        }

        .lightbox-thumbnails::-webkit-scrollbar { height: 4px; }
        .lightbox-thumbnails::-webkit-scrollbar-track { background: transparent; }
        .lightbox-thumbnails::-webkit-scrollbar-thumb { background: var(--yellow); border-radius: 2px; }

        .lightbox-thumbnails img {
            height: 100%;
            width: 140px;
            object-fit: cover;
            cursor: pointer;
            opacity: 0.3;
            transition: all 0.4s ease;
            filter: grayscale(80%);
        }

        .lightbox-thumbnails img:hover {
            opacity: 0.8;
            filter: grayscale(0%);
        }

        .lightbox-thumbnails img.active-thumb {
            opacity: 1;
            filter: grayscale(0%);
            box-shadow: 0 0 0 2px var(--yellow);
        }

        #bottom-menu-bar {
            position: fixed;
            left: 0; bottom: 0;
            width: 100%; height: var(--menu-bar-h);
            z-index: 200;
            display: flex; align-items: center; justify-content: center;
            gap: clamp(16px, 4vw, 58px);
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.9) 35%, #000 100%);
            border-top: 2px solid var(--yellow);
            box-shadow: 0 -12px 30px rgba(0,0,0,0.55), 0 -1px 18px rgba(255,179,0,0.2);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 6px 20px calc(env(safe-area-inset-bottom, 0px)) 20px;
            box-sizing: border-box;
        }

        .menu-bar-item {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 5px; background: none; border: none; cursor: pointer; text-decoration: none;
            color: var(--white); font-family: 'Aztro', 'Segoe UI', Tahoma, sans-serif; text-transform: uppercase;
            letter-spacing: 1px; font-size: 11px; white-space: nowrap;
            transition: color 0.25s ease, transform 0.25s ease;
            padding: 8px 4px;
        }

        .menu-bar-item i {
            font-size: 19px; display: block;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), color 0.25s ease, text-shadow 0.25s ease;
        }

        .menu-bar-item:hover, .menu-bar-item.active { color: var(--yellow); }
        .menu-bar-item:hover i, .menu-bar-item.active i { text-shadow: 0 0 14px rgba(255,179,0,0.9); }
        .menu-bar-item:hover { transform: translateY(-4px); }
        .menu-bar-item:hover i { transform: scale(1.18); }
        .menu-bar-item:active { transform: translateY(-1px) scale(0.95); }
        .menu-bar-item:focus-visible { outline: 2px solid var(--yellow); outline-offset: 4px; border-radius: 6px; }

        @media (max-width: 900px) {
            .project-title { font-size: 3rem; letter-spacing: 10px; }
        }

        @media (max-width: 768px) {
            :root { --menu-bar-h: 62px; }
            .picos-blancos-top { height: 10px; }
            .close-btn { width: 50px; height: 50px; font-size: 26px; top: 15px; right: 15px; } /* Ajuste de botón para móvil */
            .menu-bar-item { font-size: 8px; gap: 3px; padding: 6px 3px; }
            .menu-bar-item i { font-size: 16px; }
            .brand-mark { display: none; }
            .project-title { font-size: 2rem; letter-spacing: 8px; }
            .treadmill-item { height: 45vh; margin-right: 20px; }
            .treadmill-viewport { height: 45vh; }
        }

        @media (max-width: 400px) {
            .menu-bar-item span { display: none; }
            .menu-bar-item i { font-size: 20px; }
            #bottom-menu-bar { gap: clamp(10px, 7vw, 26px); }
        }
    </style>
</head>

    <script>
      
        const track = document.getElementById('track');
        let currentX = 0;
        let isDragging = false;
        let startX = 0;
        let startScrollX = 0;
        let isClick = true; 
        const scrollSpeed = 0.9; 

        function animateTrack() {
            if (!isDragging) {
                currentX -= scrollSpeed;
            }
  
            const halfway = track.scrollWidth / 2;
            
            if (Math.abs(currentX) >= halfway) {
                currentX += halfway;
            } else if (currentX > 0) {
                currentX -= halfway; 
            }

            track.style.transform = `translateX(${currentX}px)`;
            requestAnimationFrame(animateTrack);
        }
        
      
        requestAnimationFrame(animateTrack);

 
        track.addEventListener('mousedown', (e) => {
            isDragging = true;
            isClick = true;
            startX = e.pageX;
            startScrollX = currentX;
            e.preventDefault(); 
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const walk = (e.pageX - startX) * 1.2; 
            if (Math.abs(walk) > 5) isClick = false; 
            currentX = startScrollX + walk;
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });


        track.addEventListener('touchstart', (e) => {
            isDragging = true;
            isClick = true;
            startX = e.touches[0].pageX;
            startScrollX = currentX;
        });

        window.addEventListener('touchmove', (e) => {
            if (!isDragging) return;
            const walk = (e.touches[0].pageX - startX) * 1.5;
            if (Math.abs(walk) > 5) isClick = false;
            currentX = startScrollX + walk;
        });

        window.addEventListener('touchend', () => {
            isDragging = false;
        });

        const lightbox = document.getElementById('lightbox');
        const mainImg = document.getElementById('lightbox-main-img');
        const thumbnailsContainer = document.getElementById('lightbox-thumbnails-container');
        const closeBtn = document.getElementById('close-lightbox');
        const lightboxBg = document.getElementById('lightbox-bg');
        const galleryItems = document.querySelectorAll('.gallery-item');

        galleryItems.forEach(item => {
            item.addEventListener('click', (e) => {
              
                if (!isClick) return; 

                const clickedImg = e.target;
                const galleryName = clickedImg.getAttribute('data-gallery');

                mainImg.src = clickedImg.src;
                lightbox.classList.add('active');
                thumbnailsContainer.innerHTML = '';

               
                const uniqueSrcs = new Set();
                const allImagesInGroup = document.querySelectorAll(`.gallery-item[data-gallery="${galleryName}"]`);
                
                allImagesInGroup.forEach(img => {
                    if (!uniqueSrcs.has(img.src)) {
                        uniqueSrcs.add(img.src);
                        
                        const thumb = document.createElement('img');
                        thumb.src = img.src;

                        if(img.src === clickedImg.src) thumb.classList.add('active-thumb');

                        thumb.addEventListener('click', () => {
                            mainImg.src = thumb.src;
                            document.querySelectorAll('.lightbox-thumbnails img').forEach(t => t.classList.remove('active-thumb'));
                            thumb.classList.add('active-thumb');
                        });

                        thumbnailsContainer.appendChild(thumb);
                    }
                });
            });
        });

       
        closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));
        lightboxBg.addEventListener('click', (e) => {

            if (e.target === lightboxBg) {
                lightbox.classList.remove('active');
            }
        });

        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('dragstart', event => event.preventDefault());
        document.addEventListener('selectstart', event => event.preventDefault());
        document.addEventListener('keydown', (e) => {
            if (e.key === 'F12') e.preventDefault();
            if (e.ctrlKey || e.metaKey) {
                const forbiddenKeys = ['c', 'u', 's', 'p', 'a', 'x', 'i', 'j'];
                if (forbiddenKeys.includes(e.key.toLowerCase())) e.preventDefault();
            }
        });
    </script>
